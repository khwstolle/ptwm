name: Docs site

on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - 'docs/benchmarks/**'
      - 'python/ptwm/**'
      - 'crates/ptwm-core/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'python/ptwm/**'
      - 'crates/ptwm-core/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUXT_TELEMETRY_DISABLED: '1'
  CI: '1'
  PTWM_DOCGEN_STRICT: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Standard ad-hoc toolchain (no Nix). Avoids running out of disk on
      # the GitHub runner: the Nix path requires building a heavy Python
      # closure (transformers/triton/etc.) from source when no FlakeHub
      # cache is available, which exceeds the runner's disk budget.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Rust (nightly for rustdoc JSON)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-14
          components: rust-src

      - name: Install Python docgen deps
        run: pip install 'griffe>=1.7.0'

      - name: Install Node deps
        working-directory: docs/site
        run: pnpm install --frozen-lockfile

      - name: Run docgen
        working-directory: docs/site
        run: pnpm run docgen

      - name: Build site
        working-directory: docs/site
        run: pnpm run generate

      # GitHub Pages' own artifact format (tar, permission-normalized) —
      # separate from a plain actions/upload-artifact, and consumed
      # directly by actions/deploy-pages in the deploy job below.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.output/public

  # Only a push to master publishes. GitHub Pages has no per-PR preview
  # environment (unlike Cloudflare Pages' branch deploys) — PRs get the
  # build-verification above but no live preview URL.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

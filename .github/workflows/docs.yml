name: Docs site

on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - 'docs/benchmarks/**'
      - 'python/ptwm/**'
      - 'crates/ptwm-core/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'python/ptwm/**'
      - 'crates/ptwm-core/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  NUXT_TELEMETRY_DISABLED: '1'
  CI: '1'
  PTWM_DOCGEN_STRICT: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Standard ad-hoc toolchain (no Nix). Avoids running out of disk on
      # the GitHub runner: the Nix path requires building a heavy Python
      # closure (transformers/triton/etc.) from source when no FlakeHub
      # cache is available, which exceeds the runner's disk budget.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Rust (nightly for rustdoc JSON)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-14
          components: rust-src

      - name: Install Python docgen deps
        run: pip install 'griffe>=1.7.0'

      - name: Install Node deps
        working-directory: docs/site
        run: pnpm install --frozen-lockfile

      - name: Run docgen
        working-directory: docs/site
        run: pnpm run docgen

      - name: Build site
        working-directory: docs/site
        run: pnpm run generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: |
            docs/site/.output/public/**
            docs/site/wrangler.toml
          if-no-files-found: error
          retention-days: 14

  # Deploy jobs run only when the Cloudflare API token is configured.
  # On forks / first-time setups the secret may be missing — in that
  # case the build still verifies the site, but deploys are skipped
  # cleanly rather than failing the PR.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs/site

      - name: Deploy to Cloudflare Pages (production)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: docs/site
          command: pages deploy .output/public --project-name=ptwm-docs --branch=main

  preview:
    needs: build
    if: github.event_name == 'pull_request' && vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: docs-preview-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs/site

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: docs/site
          command: pages deploy .output/public --project-name=ptwm-docs --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            **Docs preview** for this PR is live:

            <${{ steps.deploy.outputs.url }}>

            *Updated on every push.*

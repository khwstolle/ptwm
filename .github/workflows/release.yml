name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Required for manual runs.'
        required: true

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macos-13 (Intel) hosted runners were retired December 2025;
          # macos-15-intel is the current x86_64 label. macos-14 is
          # Apple Silicon (arm64) and stays until the announced 2027
          # architecture cutover.
          - os: macos-15-intel
            target: x86_64
            manylinux: ''
          - os: macos-14
            target: aarch64
            manylinux: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build wheels via maturin
        # Linux runners use manylinux2014 (set via the `manylinux: auto`
        # input) so the resulting wheels run on any modern glibc-based
        # distro. macOS runners build native wheels — macos-15-intel
        # emits x86_64, macos-14 emits arm64.
        #
        # CFLAGS_aarch64_unknown_linux_gnu works around a `ring` build
        # failure under the manylinux2014 aarch64 cross-compiler: its
        # pregenerated ARM assembly expects the preprocessor macro
        # __ARM_ARCH, which that gcc doesn't define by default. This
        # only affects the aarch64-unknown-linux-gnu target (docker
        # cross-compile), so it's a no-op for the other matrix entries.
        #
        # before-script-linux installs Perl core modules that git2's
        # vendored-openssl feature needs at build time: its Configure
        # script requires both IPC::Cmd and Time::Piece, neither of
        # which is included in the manylinux2014 x86_64 image's
        # preinstalled `perl` package (confirmed: `yum install -y perl`
        # alone is a no-op there — "Nothing to do" — since some minimal
        # perl already satisfies that package name without pulling in
        # the optional/dual-life core modules). The x86_64 leg's
        # manylinux2014 image is RHEL-based (yum, explicit module
        # packages); the aarch64 leg cross-compiles inside
        # ghcr.io/rust-cross/manylinux2014-cross, which is Debian-based
        # (apt) — there installing the full `perl` package (after an
        # apt cache refresh) does pull in the bundled core modules, so
        # no per-module chasing is needed there. Only runs inside the
        # Linux docker container, so it's a no-op on macOS.
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.12 3.13
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: (yum install -y perl-IPC-Cmd perl-Time-Piece) || (apt-get update && apt-get install -y perl)

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build sdist via maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ptwm
    # Required for PyPI trusted publishing (OIDC). Configure on PyPI
    # at https://pypi.org/manage/project/ptwm/settings/publishing/ —
    # no API token needed.
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Defaults: PyPI prod, OIDC via the `pypi` environment above.

  github-release:
    name: Attach artifacts to GitHub release
    needs: [build-wheels, build-sdist]
    # A manual workflow_dispatch re-run (e.g. to retry a failed leg
    # against an already-tagged release) has github.ref pointing at the
    # dispatched branch, not the tag — so this also accepts a dispatch
    # run carrying the required `tag` input.
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

[workspace]
resolver = "2"
members = [
    "crates/ptwm-core",
    "crates/ptwm-py",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/khwstolle/ptwm"

[workspace.dependencies]
rayon = "1.10"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
pyo3 = "0.24"
zstd = "0.13"
blake3 = "1.5"
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Workspace-wide clippy lint config. The "allow" entries below are
# stylistic lints flagged by `cargo clippy -- -D warnings` that we
# intentionally accept: index-based loops over fixed-size numerical
# arrays read more clearly than `iter().enumerate()`, and `&mut Vec`
# vs `&mut [_]` doesn't matter for in-crate scratch buffers.
[workspace.lints.clippy]
needless_range_loop = "allow"
manual_memcpy = "allow"
ptr_arg = "allow"
doc_lazy_continuation = "allow"
type_complexity = "allow"

[package]
name = "ptwm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lossless compression for neural network weights."

[lib]
name = "ptwm_core"
crate-type = ["rlib"]

[dependencies]
rayon.workspace = true
crc32fast.workspace = true
xxhash-rust.workspace = true
blake3.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with = "3"
toml = "0.8"
ciborium = "0.2"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
walkdir = "2"
which = "6"
ureq = "2"
wasmtime = "26"
wasmtime-wasi = "26"
libloading = "0.8"
oci-client = { version = "0.13", default-features = false, features = ["rustls-tls"] }
git2 = { version = "0.19", default-features = false, features = ["https", "vendored-openssl"] }
tar = "0.4"
fs_extra = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
pyo3 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[features]
default = ["codec-zstd"]
# Enable `impl From<PtwmCoreError> for PyErr`. Used by the `ptwm-py`
# binding crate; kept opt-in so consumers that don't need Python interop
# (standalone CLI, future Rust-only tools) can avoid the pyo3 transitive dep.
pyo3 = ["dep:pyo3"]
# Enable the ZSTD codec as one of the per-plane entropy coders.
codec-zstd = ["dep:zstd"]
# Enable the lossy `FloatDelta` op. Disabled by default because IEEE 754
# rounding in `(a - b) + b` can break the byte-exact round-trip invariant.
# Opt in only when approximate decoding is acceptable.
lossy = []

[dev-dependencies]
wat = "1"

[lints]
workspace = true

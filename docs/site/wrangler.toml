# Cloudflare Pages deployment config.
#
# The docs site uses the `cloudflare_pages` Nitro preset and emits a fully
# prerendered static bundle to `.output/public/`. Deployment is via
# `wrangler pages deploy .output/public --project-name=ptwm-docs` and runs
# through GitHub Actions on push to master / on pull requests.
#
# The Workers preset (`cloudflare_module`) is intentionally not used here:
# it pulls @nuxt/content's runtime SQL layer onto Workers and requires a
# D1 database. The site has no SSR routes, so prerendering covers everything.

name = "ptwm-docs"
compatibility_date = "2026-04-01"
pages_build_output_dir = ".output/public"
